# NeurIPS landing page (/nips/) — one block per project: title + buttons.
#   id     page slug → /nips/<id>/ (and anchor /nips/#<id> on the overview)
#   go     shortlink number, QUOTED → /go/<go>/ redirects to /nips/<id>/. Never reuse or
#          change a number once its QR code is printed.
#   pub    exact title in data/publications.yaml → borrows its arXiv link
#   links  { arxiv, demo, code } — empty or missing ones are skipped

